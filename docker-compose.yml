version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: restuvexo_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: restuvexo
    ports:
      - "5432:5432"
    volumes:
      - restuvexo_pgdata:/var/lib/postgresql/data

volumes:
  restuvexo_pgdata:
